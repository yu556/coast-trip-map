<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>海边之旅 · 地图行程</title>
  <!-- 高德 JS API 2.0：须先设置安全密钥，再加载 maps 脚本 -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: "e18b129c2972976d1fe758d4003a0fec",
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=51b25f3f71ee69fdee427c9e8926fc5e"></script>
  <style>
    :root {
      --ink: #12263a;
      --ink-soft: #3d566e;
      --sea: #1a6b7a;
      --sea-deep: #0f4c59;
      --foam: #e8f2f4;
      --sand: #f3eee6;
      --coral: #c45c3e;
      --line: rgba(18, 38, 58, 0.12);
      --panel: rgba(255, 252, 248, 0.96);
      --day1: #1a6b7a;
      --day2: #2a8f7b;
      --day3: #3d7ea6;
      --day4: #5a6fa8;
      --day5: #c45c3e;
      --radius: 18px;
      --shadow: 0 12px 40px rgba(18, 38, 58, 0.14);
      --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
      --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--sand);
      overflow: hidden;
      position: fixed;
      inset: 0;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) 1fr;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    /* —— Left rail（PC 行程卡片固定左侧） —— */
    .rail {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--line);
      z-index: 500;
      min-height: 0;
      grid-column: 1;
      grid-row: 1;
      animation: rail-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rail-in {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .brand {
      padding: 22px 22px 14px;
      background: #f0f6f7;
      border-bottom: 1px solid var(--line);
    }

    .brand-kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sea);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .brand h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink);
    }

    .brand p {
      margin-top: 8px;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .brand-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(26, 107, 122, 0.1);
      color: var(--sea-deep);
      border: 1px solid rgba(26, 107, 122, 0.18);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .day-btn {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      border-radius: 14px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    }
    .day-btn:hover { transform: translateY(-1px); border-color: rgba(26, 107, 122, 0.35); }
    .day-btn.active {
      background: var(--sea-deep);
      color: #fff;
      border-color: var(--sea-deep);
    }
    .day-btn .d-label {
      display: block;
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .day-btn .d-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
      scroll-behavior: smooth;
    }

    .list-section {
      margin-bottom: 18px;
    }

    .list-section h2 {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 8px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stop {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: #fff;
      border-radius: 16px;
      padding: 14px 14px 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.18s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
    }
    .stop::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent, var(--sea));
    }
    .stop:hover {
      border-color: rgba(26, 107, 122, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(18, 38, 58, 0.08);
    }
    .stop:active { transform: translateY(0); }
    .stop.selected {
      border-color: rgba(26, 107, 122, 0.45);
      background: var(--foam);
      box-shadow: 0 8px 22px rgba(26, 107, 122, 0.12);
    }
    .stop.lodging-card {
      background: linear-gradient(135deg, #fff 0%, rgba(26, 107, 122, 0.04) 100%);
    }

    .stop-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent, var(--sea));
      letter-spacing: 0.04em;
    }
    .stop-name {
      font-size: 15px;
      font-weight: 600;
      margin-top: 4px;
      line-height: 1.35;
    }
    .stop-desc {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
      line-height: 1.45;
    }
    .stop-type {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(18, 38, 58, 0.06);
      color: var(--ink-soft);
    }

    /* —— Map —— */
    .map-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #d5e4e8;
      grid-column: 2;
      grid-row: 1;
      animation: map-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
    }

    @keyframes map-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #d5e4e8;
    }

    .map-status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #d5e4e8;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
    }
    .map-status.hide { display: none; }
    .map-status.error {
      pointer-events: auto;
      background: #f3eee6;
      color: var(--ink);
    }
    .map-status strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 16px; }

    .map-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 450;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .hud-card {
      background: rgba(255, 252, 248, 0.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--ink-soft);
      max-width: 220px;
    }
    .hud-card strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .fit-btn {
      border: none;
      background: var(--sea-deep);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .fit-btn:hover { background: var(--sea); }

    /* Detail sheet —— PC 贴地图左侧，贴近行程栏 */
    .sheet {
      position: absolute;
      left: 20px;
      right: auto;
      bottom: 20px;
      z-index: 460;
      width: min(360px, calc(100% - 40px));
      max-width: 360px;
      background: rgba(255, 252, 248, 0.97);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      transform: translateX(-18px) translateY(8px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s;
      backdrop-filter: blur(10px);
    }
    .sheet.open {
      transform: translateX(0) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .sheet-day {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent, var(--sea));
    }
    .sheet h3 {
      font-family: var(--font-display);
      font-size: 22px;
      margin-top: 4px;
      line-height: 1.2;
    }
    .sheet-close {
      border: none;
      background: rgba(18, 38, 58, 0.06);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--ink-soft);
      flex-shrink: 0;
    }
    .sheet-body {
      margin-top: 10px;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--coral);
      color: #fff;
      flex: 1;
      min-width: 140px;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost {
      background: rgba(18, 38, 58, 0.06);
      color: var(--ink);
    }

    /* 路线中点：距离 + 驾车时间 */
    .route-label {
      background: rgba(255, 252, 248, 0.96);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(18, 38, 58, 0.16);
      white-space: nowrap;
      pointer-events: none;
      line-height: 1.2;
    }
    .route-label .route-label-time {
      color: var(--sea-deep);
    }
    .route-label .route-label-sep {
      opacity: 0.35;
      margin: 0 4px;
    }

    .leg-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 10px 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--ink-soft);
      border-left: 2px dashed var(--accent, var(--sea));
      line-height: 1.3;
    }
    .leg-chip strong {
      color: var(--sea-deep);
      font-weight: 600;
    }
    .leg-chip.pending { opacity: 0.55; }
    .leg-chip.fail { color: var(--coral); border-left-style: solid; }

    /* Map marker pin */
    .pin {
      width: 34px;
      height: 34px;
      border-radius: 50% 50% 50% 4px;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(18, 38, 58, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s, filter 0.2s;
    }
    .pin span {
      transform: rotate(45deg);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-body);
    }
    .pin.selected {
      transform: rotate(-45deg) scale(1.22);
      box-shadow: 0 6px 18px rgba(18, 38, 58, 0.45);
      z-index: 2;
    }
    .pin.lit {
      transform: rotate(-45deg) scale(1.22);
      border-width: 3px;
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.95),
        0 0 0 9px rgba(26, 107, 122, 0.4),
        0 8px 22px rgba(18, 38, 58, 0.45);
      animation: pin-lit-pulse 1.2s ease-out 1;
      z-index: 2;
    }
    .pin.lit.selected {
      transform: rotate(-45deg) scale(1.26);
    }
    .pin.dim {
      opacity: 0.28;
      filter: grayscale(0.55);
      transform: rotate(-45deg) scale(0.78);
      box-shadow: 0 2px 6px rgba(18, 38, 58, 0.2);
      pointer-events: auto;
    }
    .pin.lodging { border-radius: 8px; transform: none; }
    .pin.lodging span { transform: none; }
    .pin.lodging.selected { transform: scale(1.14); }
    .pin.lodging.lit {
      transform: scale(1.18);
      animation: pin-lit-pulse-box 1.2s ease-out 1;
    }
    .pin.lodging.lit.selected { transform: scale(1.22); }
    .pin.lodging.dim { transform: scale(0.78); }

    @keyframes pin-lit-pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 107, 122, 0.55), 0 8px 22px rgba(18, 38, 58, 0.35); }
      70% { box-shadow: 0 0 0 14px rgba(26, 107, 122, 0), 0 8px 22px rgba(18, 38, 58, 0.35); }
      100% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.95), 0 0 0 8px rgba(26, 107, 122, 0.35), 0 8px 22px rgba(18, 38, 58, 0.45); }
    }
    @keyframes pin-lit-pulse-box {
      0% { box-shadow: 0 0 0 0 rgba(26, 107, 122, 0.55); }
      70% { box-shadow: 0 0 0 14px rgba(26, 107, 122, 0); }
      100% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.95), 0 0 0 8px rgba(26, 107, 122, 0.35), 0 8px 22px rgba(18, 38, 58, 0.45); }
    }

    .amap-logo, .amap-copyright { opacity: 0.7 !important; }
    .amap-marker-label { border: none !important; background: transparent !important; }

    .mobile-bar,
    .drawer-grab,
    .desktop-only-spacer { display: none; }

    .btn-icon {
      flex: 0 0 48px;
      min-width: 48px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
    }
    .sheet-secondary {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .sheet-secondary .btn {
      flex: 1;
      min-width: 0;
    }

    .mobile-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .mobile-home {
      display: none;
    }
    .peek-copy { min-width: 0; flex: 1; }
    .peek-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .peek-nav {
      display: none;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--coral);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
    }
    .peek-nav[hidden] { display: none !important; }

    /* —— Mobile：地图优先 + 底部日程抽屉 —— */
    @media (max-width: 860px) {
      .app {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      .rail,
      .map-wrap {
        grid-column: unset;
        grid-row: unset;
        animation: none;
      }

      .mobile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 520;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
        background: rgba(255, 252, 248, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .mobile-bar-text { min-width: 0; }
      .mobile-bar-kicker {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--sea);
        font-weight: 600;
      }
      .mobile-bar-title {
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mobile-bar-meta {
        font-size: 11px;
        color: var(--ink-soft);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mobile-home,
      .mobile-fit {
        border: none;
        background: #fff;
        color: var(--sea-deep);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 10px 12px;
        min-height: 40px;
        border-radius: 999px;
        border: 1px solid var(--line);
        white-space: nowrap;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .mobile-home {
        display: inline-flex;
        align-items: center;
        background: rgba(196, 92, 62, 0.1);
        color: var(--coral);
        border-color: rgba(196, 92, 62, 0.28);
      }
      .mobile-home:active,
      .mobile-fit:active { transform: scale(0.97); }

      .map-wrap {
        position: absolute;
        inset: 0;
        order: unset;
        height: 100%;
        min-height: 0;
      }

      .map-hud {
        top: calc(58px + env(safe-area-inset-top, 0px));
        right: 12px;
      }
      .fit-btn { display: none; }
      .hud-card { display: none; }

      .rail {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        order: unset;
        z-index: 540;
        display: flex;
        flex-direction: column;
        border-right: none;
        border-top: none;
        border-radius: 22px 22px 0 0;
        background: rgba(255, 252, 248, 0.98);
        box-shadow: 0 -8px 32px rgba(18, 38, 58, 0.14);
        height: var(--drawer-h, 42dvh);
        max-height: calc(92dvh - env(safe-area-inset-top, 0px));
        transition: height 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        overflow: hidden;
        min-height: 0;
      }
      /* 手机只保留两档：看地图 / 看行程，减少决策成本 */
      .rail[data-snap="peek"] { --drawer-h: calc(132px + env(safe-area-inset-bottom, 0px)); }
      .rail[data-snap="half"],
      .rail[data-snap="full"] { --drawer-h: calc(62dvh - env(safe-area-inset-top, 0px) * 0.2); }
      .rail[data-snap="full"] { --drawer-h: calc(88dvh - env(safe-area-inset-top, 0px)); }

      .drawer-grab {
        display: block;
        flex-shrink: 0;
        padding: 8px 14px 8px;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      .grab-bar {
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: rgba(18, 38, 58, 0.18);
        margin: 0 auto 10px;
      }
      .peek-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .peek-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .peek-sub {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 2px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .peek-nav { display: inline-flex; }
      .peek-toggle {
        border: none;
        background: rgba(26, 107, 122, 0.1);
        color: var(--sea-deep);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 10px 14px;
        min-height: 44px;
        border-radius: 999px;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .brand { display: none; }

      /* 日期：横滑大拇指芯片，不再挤成 3×2 小格 */
      .days {
        display: flex;
        grid-template-columns: none;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        padding: 4px 14px 12px;

    const dayMap = Object.fromEntries(DAYS.map((d) => [d.id, d]));

    /** 行程日历：用于「今天 / 距出发」文案（本地时区） */
    const TRIP_DATES = {
      d1: "2026-09-15",
      d2: "2026-09-16",
      d3: "2026-09-17",
      d4: "2026-09-18",
      d5: "2026-09-19",

    function isMobile() {
      return window.matchMedia("(max-width: 860px)").matches;
    }

    function todayKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const iso = `${y}-${m}-${d}`;
      return Object.keys(TRIP_DATES).find((k) => TRIP_DATES[k] === iso) || null;
    }

    function daysUntilTrip() {
      const start = new Date(2026, 8, 15); // month 0-indexed
      const now = new Date();
      const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((start - a) / 86400000);
    }

    /** 当前情境下的「今晚/本段」酒店：青岛段优先贝叶 */
    function getHomeHotel(dayId) {
      const day = dayId && dayId !== "all" ? dayId : (selectedId
        ? (STOPS.find((s) => s.id === selectedId) || {}).day
        : (todayKey() || activeDay));
      const scope = day && day !== "all" ? day : null;
      if (scope === "d3" || scope === "d4" || scope === "d5") {
        return STOPS.find((s) => s.id === "d3-hotel") || STOPS.find((s) => s.homeBase);
      }
      if (scope === "d1" || scope === "d2") {
        return STOPS.find((s) => s.id === "d1-hotel");
      }
      // 全览：已订青岛酒店优先展示
      return STOPS.find((s) => s.id === "d3-hotel") || STOPS.find((s) => s.lodging);
    }

    function navHrefFor(stop) {
      if (!stop) return "#";
      if (stop.resolved) return amapNavUrl(stop);
      const kw = encodeURIComponent(stop.keyword || stop.name);
      const city = encodeURIComponent(stop.city || "");
      return `https://uri.amap.com/search?keyword=${kw}&city=${city}&callnative=1&src=coast-trip`;
    }

    function goHomeHotel() {
      const scope = activeDay !== "all" ? activeDay : (todayKey() || "d3");
      let hotel = null;
      if (scope === "d1" || scope === "d2") {
        hotel = STOPS.find((s) => s.id === "d1-hotel");
      } else if (scope === "d4") {
        hotel = STOPS.find((s) => s.id === "d4-hotel");
      } else if (scope === "d5") {
        hotel = STOPS.find((s) => s.id === "d5-depart"); // 同坐标，留在 D5
      } else {
        hotel = STOPS.find((s) => s.id === "d3-hotel");

      if (!hotel) return;

      if (activeDay !== "all" && hotel.day !== activeDay) {
        activeDay = hotel.day;
        renderDayFilters();
        renderList();
        renderMarkers();
      }
      selectStop(hotel.id, { fromList: true });

    function orderedStopsForNav() {
      const pool = activeDay === "all"
        ? STOPS.slice().sort((a, b) => {
            const da = DAYS.findIndex((d) => d.id === a.day);
            const db = DAYS.findIndex((d) => d.id === b.day);
            return da === db ? a.order - b.order : da - db;
          })
        : STOPS.filter((s) => s.day === activeDay).sort((a, b) => a.order - b.order);
      return pool;
    }

    function stepStop(dir) {
      const pool = orderedStopsForNav();
      if (!pool.length) return;
      const idx = pool.findIndex((s) => s.id === selectedId);
      const next = idx < 0 ? pool[0] : pool[idx + dir];
      if (!next) return;
      if (activeDay !== "all" && next.day !== activeDay) {
        activeDay = next.day;
        renderDayFilters();
        renderList();
        renderMarkers();
      }
      selectStop(next.id, { fromList: true });
    }

    function setDrawerSnap(snap) {
      // 手机端把 half 与 full 收敛：half=展开行程，full=几乎全屏列表

      rail.dataset.snap = snap;

    function updatePeekCopy() {
      const day = dayMap[activeDay];
      const count = visibleStops().length;
      const title = document.getElementById("peekTitle");
      const sub = document.getElementById("peekSub");
      const peekNav = document.getElementById("peekNavBtn");
      if (!title || !sub) return;

      const selected = selectedId ? STOPS.find((s) => s.id === selectedId) : null;
      if (selected) {
        title.textContent = selected.name;
        sub.textContent = `${dayMap[selected.day].short} · ${selected.time} · ${selected.type}`;
        if (peekNav) {
          peekNav.hidden = false;
          peekNav.href = navHrefFor(selected);
          peekNav.textContent = selected.lodging ? "导航回酒店" : "导航";
        }
      } else if (activeDay === "all") {
        title.textContent = `全部行程 · ${count} 站`;
        sub.textContent = drawerSnap === "peek" ? "上滑查看日程 · 右上角可回酒店" : "点地点可导航到高德";
        if (peekNav) peekNav.hidden = true;
      } else {
        title.textContent = `${day.short} ${day.title} · ${count} 站`;
        sub.textContent = day.date + (day.summary ? " · " + day.summary.split("·")[0].trim() : "");
        if (peekNav) peekNav.hidden = true;

      updateMobileChrome();

    function setupMobileDrawer() {
      const grab = document.getElementById("drawerGrab");
      const toggle = document.getElementById("peekToggle");
      const mobileFit = document.getElementById("mobileFitBtn");
      const mobileHome = document.getElementById("mobileHomeBtn");
      if (!grab) return;

      const order = ["peek", "half", "full"];
      const cycle = (dir) => {
        if (isMobile()) {
          // 两档：peek ↔ half（展开）
          if (dir > 0) setDrawerSnap(drawerSnap === "peek" ? "half" : "full");
          else setDrawerSnap(drawerSnap === "full" ? "half" : "peek");
          return;
        }
        const i = order.indexOf(drawerSnap);
        const next = order[Math.max(0, Math.min(order.length - 1, i + dir))];
        setDrawerSnap(next);
      };

      toggle && toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isMobile()) {
          if (drawerSnap === "peek") {
            closeSheet();
            setDrawerSnap("half");
          } else {
            setDrawerSnap("peek");
          }
          return;
        }
        if (drawerSnap === "full") setDrawerSnap("half");
        else if (drawerSnap === "half") setDrawerSnap("full");
        else setDrawerSnap("half");
      });

      grab.addEventListener("click", (e) => {
        if (e.target.closest(".peek-nav, .peek-toggle")) return;
        if (isMobile()) {
          if (drawerSnap === "peek") {
            closeSheet();
            setDrawerSnap("half");
          } else {
            setDrawerSnap("peek");
          }
          return;
        }
        if (drawerSnap === "peek") setDrawerSnap("half");
        else if (drawerSnap === "half") setDrawerSnap("full");
        else setDrawerSnap("half");
      });

      let startY = 0;
      grab.addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
      }, { passive: true });
      grab.addEventListener("touchend", (e) => {
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dy) < 28) return;
        if (dy < 0) cycle(1);
        else cycle(-1);
      }, { passive: true });

      mobileFit && mobileFit.addEventListener("click", () => {
        activeDay = "all";
        selectedId = null;
        closeSheet();
        renderDayFilters();
        renderList();
        renderMarkers();
        setDrawerSnap("peek");
        fitToVisible(80);

      mobileHome && mobileHome.addEventListener("click", () => {
        goHomeHotel();

      if (isMobile()) {
        const tk = todayKey();
        activeDay = tk || "all";
        setDrawerSnap(tk ? "half" : "peek");
      }

      window.addEventListener("resize", () => {
        if (!isMobile()) {
          document.getElementById("rail").dataset.snap = "half";
        }
        if (map) {
          map.resize();
          fitToVisible();
        }
      });
    }

    function setMapStatus(html, isError) {

    function pinState(stop) {
      const selected = selectedId === stop.id;

      return { selected, lit: selected, dim };

    function pinHtml(stop, state) {
      const st = state && typeof state === "object" ? state : pinState(stop);
      // 兼容旧调用 pinHtml(stop, true)
      if (state === true) st.selected = true;
      if (state === false) st.selected = false;
      const color = dayMap[stop.day].color;
      const cls = [
        "pin",
        stop.lodging ? "lodging" : "",
        st.selected ? "selected" : "",
        st.lit ? "lit" : "",
        st.dim ? "dim" : "",

      return `<div class="${cls}" style="background:${color}"><span>${label}</span></div>`;

    function loadPlaceSearch() {

        function pickBestPoi(pois, stop) {
      if (!pois || !pois.length) return null;
      if (stop.id === "d1-depart") {
        const prefer = pois.find((p) => /天通苑/.test(p.name) && /地铁|轨道交通/.test(p.name))
          || pois.find((p) => /天通苑站/.test(p.name) && !/北|南/.test(p.name))
          || pois.find((p) => p.name === "天通苑" || /^天通苑\(/.test(p.name));
        if (prefer) return prefer;
      }
      if (stop.id === "d1-hotel" || stop.id === "d2-hotel") {
        const prefer = pois.find((p) => /花筑.*新亨|新亨元利/.test(p.name))
          || pois.find((p) => /花筑/.test(p.name) && /威海|韩乐|别院/.test(p.name));
        if (prefer) return prefer;
      }
      if (stop.id === "d5-hotel") {
        const prefer = pois.find((p) => /羲荷/.test(p.name) && /天使|胖东来/.test(p.name))
          || pois.find((p) => /羲荷酒店/.test(p.name));
        if (prefer) return prefer;
      }
      if (stop.id === "d3-hotel" || stop.id === "d4-hotel" || stop.id === "d5-depart") {
        const prefer = pois.find((p) => /贝叶/.test(p.name) && /酒店|PATTRA|pattra/i.test(p.name))
          || pois.find((p) => /贝叶/.test(p.name))
          || pois.find((p) => /尚嘉中心/.test(p.name) && /珠江/.test(p.address || p.name || ""));
        if (prefer) return prefer;
      }
      if (stop.id === "d2-sunset") {
        const prefer = pois.find((p) => /日落湾(沙滩|海水浴场|房车)/.test(p.name))
          || pois.find((p) => /日落湾/.test(p.name) && !/民宿|酒店|俱乐部/.test(p.name));
        if (prefer) return prefer;
      }
      if (stop.id === "d2-dumpling") {
        const prefer = pois.find((p) => p.name === "诚心水饺") || pois.find((p) => /诚心水饺/.test(p.name));
        if (prefer) return prefer;
      }
      if (stop.id === "d2-park") {
        const prefer = pois.find((p) => p.name === "喂海公园" || /喂.?海/.test(p.name));
        if (prefer) return prefer;
      }
      const keys = [stop.keyword, stop.altKeyword, stop.name]
        .filter(Boolean)
        .map((s) => String(s).replace(/[·！!（）()]/g, "").trim());
      for (const key of keys) {
        const hit = pois.find((p) => p.name && (p.name.includes(key) || key.includes(p.name)));
        if (hit) return hit;
      }
      if ((stop.keyword || "").includes("停车")) {
        const park = pois.find((p) => /停车/.test(p.name));
        if (park) return park;
      }
      return pois[0];
    }

    function applyPoi(stop, poi) {
      if (!poi || !poi.location) return false;
      const lng = typeof poi.location.getLng === "function" ? poi.location.getLng() : poi.location.lng;
      const lat = typeof poi.location.getLat === "function" ? poi.location.getLat() : poi.location.lat;
      if (!lng || !lat) return false;
      if (!isValidChinaLngLat(lng, lat)) {
        console.warn("POI 坐标异常，已忽略", stop.id, lng, lat, poi.name);
        return false;
      }
      stop.lng = Number(lng);
      stop.lat = Number(lat);
      stop.resolvedName = poi.name;
      stop.resolved = true;
      return true;
    }

    function searchOnce(ps, keyword, city) {
      return new Promise((resolve) => {
        ps.setCity(city || "全国");
        ps.search(keyword, (status, result) => {
          if (status === "complete" && result && result.poiList && result.poiList.pois) {
            resolve(result.poiList.pois);
          } else {
            resolve([]);
          }
        });
      });
    }

    function detailsOnce(ps, poiId) {
      return new Promise((resolve) => {
        ps.getDetails(poiId, (status, result) => {
          if (status === "complete" && result && result.poiList && result.poiList.pois && result.poiList.pois[0]) {
            resolve(result.poiList.pois[0]);
          } else if (status === "complete" && result && result.poi) {
            resolve(result.poi);
          } else {
            resolve(null);
          }
        });
      });
    }

    async function resolveOnePlace(ps, stop) {
      if (stop.skipResolve) return stop;

      if (stop.poiId) {
        const detail = await detailsOnce(ps, stop.poiId);
        if (applyPoi(stop, detail)) return stop;
      }

      const tries = [stop.keyword, stop.altKeyword].filter(Boolean);
      for (const kw of tries) {
        const pois = await searchOnce(ps, kw, stop.city);
        const best = pickBestPoi(pois, stop);
        if (applyPoi(stop, best)) return stop;
      }

      // 合庆码头兜底：海源公园
      if (stop.id === "d1-seafood") {
        const detail = await detailsOnce(ps, "B027700479");
        if (applyPoi(stop, detail)) {
          stop.resolvedName = (stop.resolvedName || "") + "（合庆码头附近）";
          return stop;
        }
      }

      // 喂海兜底：葡萄滩附近搜喂
      if (stop.id === "d2-park") {
        const pois = await searchOnce(ps, "喂海公园", "威海");
        if (applyPoi(stop, pickBestPoi(pois, stop))) return stop;
      }

      // 日落湾兜底：文化西路地址
      if (stop.id === "d2-sunset") {
        const pois = await searchOnce(ps, "文化西路358号", "威海");
        if (applyPoi(stop, pickBestPoi(pois, { keyword: "日落" }))) return stop;
      }

      // 酒店兜底：按城市关键词再搜一次
      if (stop.id === "d1-hotel" || stop.id === "d2-hotel") {
        const pois = await searchOnce(ps, "新亨元利别院", "威海");
        if (applyPoi(stop, pickBestPoi(pois, stop))) return stop;
        const pois2 = await searchOnce(ps, "花筑 韩乐坊", "威海");
        if (applyPoi(stop, pickBestPoi(pois2, stop))) return stop;
      }
      if (stop.id === "d5-hotel") {
        const pois = await searchOnce(ps, "羲荷酒店", "许昌");
        if (applyPoi(stop, pickBestPoi(pois, stop))) return stop;
        const pois2 = await searchOnce(ps, "金石国际7号楼", "许昌");
        if (applyPoi(stop, pickBestPoi(pois2, { keyword: "金石国际" }))) {
          stop.resolvedName = (stop.resolvedName || "金石国际") + "（羲荷酒店附近）";
          return stop;
        }
      }
      if (stop.id === "d3-hotel" || stop.id === "d4-hotel" || stop.id === "d5-depart") {
        const tries = [
          ["贝叶酒店", "青岛"],
          ["贝叶PATTRA酒店", "青岛"],
          ["尚嘉中心 A1", "青岛"],
          ["珠江路31号", "青岛"],
        ];
        for (const [kw, city] of tries) {
          const pois = await searchOnce(ps, kw, city);
          if (applyPoi(stop, pickBestPoi(pois, stop))) return stop;
        }
      }

      return stop;
    }

    async function resolveAllPlaces() {
      const ps = await loadPlaceSearch();
      // 串行更稳，避免并发限流
      for (const stop of STOPS) {
        await resolveOnePlace(ps, stop);
      }
      // 贝叶酒店坐标同步到续住 / 出发点
      const baye = STOPS.find((s) => s.id === "d3-hotel");
      if (baye && baye.resolved) {
        ["d4-hotel", "d5-depart"].forEach((id) => {
          const s = STOPS.find((x) => x.id === id);
          if (!s) return;
          s.lng = baye.lng;
          s.lat = baye.lat;
          s.resolved = true;
          s.resolvedName = baye.resolvedName;
        });
      }
      console.log(
        "POI校准完成",
        STOPS.map((s) => ({
          id: s.id,
          name: s.name,
          resolved: s.resolvedName || "(未校准)",
          lng: s.lng,
          lat: s.lat,
        }))
      );
    }

    function formatDistance(meters) {
      if (meters == null || Number.isNaN(meters)) return "—";
      if (meters < 1000) return Math.round(meters) + " 米";
      const km = meters / 1000;
      return (km >= 100 ? km.toFixed(0) : km.toFixed(1)) + " 公里";
    }

    function formatDuration(seconds) {
      if (seconds == null || Number.isNaN(seconds)) return "—";
      const s = Math.max(0, Math.round(seconds));
      if (s < 60) return s + " 秒";
      const m = Math.round(s / 60);
      if (m < 60) return m + " 分钟";
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return rem ? `${h} 小时 ${rem} 分` : `${h} 小时`;
    }

    function routeCacheKey(from, to) {
      return `${from.id}>${to.id}@${Number(from.lng).toFixed(5)},${Number(from.lat).toFixed(5)}>${Number(to.lng).toFixed(5)},${Number(to.lat).toFixed(5)}`;
    }

    function loadDriving() {
      return new Promise((resolve, reject) => {
        if (window.__driving) return resolve(window.__driving);
        AMap.plugin(["AMap.Driving"], () => {
          window.__driving = new AMap.Driving({
            policy: AMap.DrivingPolicy.LEAST_TIME,
            ferry: 1,
          });
          resolve(window.__driving);
        });
        setTimeout(() => {
          if (!window.__driving) reject(new Error("Driving 加载超时"));
        }, 8000);
      });
    }

    function extractRoutePath(route) {
      const path = [];
      (route.steps || []).forEach((step) => {
        (step.path || []).forEach((p) => path.push(p));
      });
      return path;
    }

    function pathMidpoint(path) {
      if (!path || !path.length) return null;
      const mid = path[Math.floor(path.length / 2)];
      if (typeof mid.getLng === "function") return [mid.getLng(), mid.getLat()];
      if (Array.isArray(mid)) return mid;
      return [mid.lng, mid.lat];
    }

    function approxMeters(from, to) {
      const x = (from.lng - to.lng) * 85000;
      const y = (from.lat - to.lat) * 111000;
      return Math.hypot(x, y);
    }

    function searchDrivingLeg(driving, from, to) {
      const key = routeCacheKey(from, to);
      if (routeCache[key]) return Promise.resolve(routeCache[key]);

      // 坐标几乎重合：跳过算路
      const distApprox = approxMeters(from, to);
      if (distApprox < 80) {
        const tiny = {
          path: [[from.lng, from.lat], [to.lng, to.lat]],
          distance: Math.round(distApprox),
          time: 60,
          mid: [(from.lng + to.lng) / 2, (from.lat + to.lat) / 2],
          skip: true,
        };
        routeCache[key] = tiny;
        return Promise.resolve(tiny);
      }

      return new Promise((resolve) => {
        driving.search(
          [from.lng, from.lat],
          [to.lng, to.lat],
          (status, result) => {
            if (status === "complete" && result && result.routes && result.routes[0]) {
              const route = result.routes[0];
              const path = extractRoutePath(route);
              const info = {
                path: path.length ? path : [[from.lng, from.lat], [to.lng, to.lat]],
                distance: route.distance,
                time: route.time,
                mid: pathMidpoint(path) || [(from.lng + to.lng) / 2, (from.lat + to.lat) / 2],
              };
              routeCache[key] = info;
              resolve(info);
            } else {
              // 失败时退回直线，仍给出粗略时长（按 40km/h）
              const approxM = distApprox;
              const fallback = {
                path: [[from.lng, from.lat], [to.lng, to.lat]],
                distance: Math.round(approxM),
                time: Math.max(60, Math.round((approxM / 1000 / 40) * 3600)),
                mid: [(from.lng + to.lng) / 2, (from.lat + to.lat) / 2],
                fallback: true,
              };
              resolve(fallback);
            }
          }
        );
      });
    }

    function clearRouteOverlays() {
      if (!map) return;
      routeOverlays.forEach((o) => {
        try { map.remove(o); } catch (_) {}
      });
      routeOverlays.length = 0;
    }

    function addRouteOverlay(from, to, info, color) {
      if (!map || !info || info.skip) return;

      const line = new AMap.Polyline({
        path: info.path,
        strokeColor: color,
        strokeWeight: info.fallback ? 3 : 5,
        strokeOpacity: info.fallback ? 0.45 : 0.82,
        strokeStyle: info.fallback ? "dashed" : "solid",
        strokeDasharray: info.fallback ? [10, 8] : undefined,
        lineJoin: "round",
        lineCap: "round",
        showDir: !info.fallback,
        zIndex: 50,
      });
      map.add(line);
      routeOverlays.push(line);

      const labelHtml = `<div class="route-label"><span class="route-label-time">${formatDuration(info.time)}</span><span class="route-label-sep">·</span>${formatDistance(info.distance)}${info.fallback ? "（估）" : ""}</div>`;
      const label = new AMap.Marker({
        position: info.mid,
        content: labelHtml,
        offset: new AMap.Pixel(-52, -14),
        zIndex: 70,
        title: `${from.name} → ${to.name}`,
      });
      map.add(label);
      routeOverlays.push(label);
    }

    async function drawDrivingRoutes(stopsByDay) {
      if (!map) return;
      const gen = ++routeGen;
      clearRouteOverlays();

      const pairs = [];
      stopsByDay.forEach(({ day, stops }) => {
        const ordered = [...stops].sort((a, b) => a.order - b.order);
        for (let i = 0; i < ordered.length - 1; i++) {
          pairs.push({ from: ordered[i], to: ordered[i + 1], color: day.color, dayId: day.id });
        }
      });

      if (!pairs.length) {
        refreshLegChips({});
        return;
      }

      const hint = document.getElementById("hudHint");
      if (hint) {
        hint.style.display = "";
        hint.innerHTML = `<strong>正在规划驾车路线…</strong>共 ${pairs.length} 段`;
      }

      let driving;
      try {
        driving = await loadDriving();
      } catch (e) {
        console.warn(e);
        if (hint && !selectedId) {
          hint.innerHTML = `<strong>路线规划不可用</strong>请检查高德 Key 是否开通驾车服务`;
        }
        return;
      }

      const legMap = {};
      const drawn = [];

      for (const pair of pairs) {
        if (gen !== routeGen) return; // 用户已切换天数
        const info = await searchDrivingLeg(driving, pair.from, pair.to);
        if (gen !== routeGen) return;
        const key = `${pair.from.id}>${pair.to.id}`;
        legMap[key] = info;
        if (!info.skip) {
          addRouteOverlay(pair.from, pair.to, info, pair.color);
          drawn.push({ ...pair, info });
        }
        refreshLegChips(legMap);
      }

      if (hint && !selectedId) {
        const totalSec = drawn.reduce((n, d) => n + (d.info.time || 0), 0);
        const totalM = drawn.reduce((n, d) => n + (d.info.distance || 0), 0);
        const scope = activeDay === "all" ? "全程驾车合计" : "当日驾车合计";
        hint.innerHTML = drawn.length
          ? `<strong>${scope}</strong>${formatDuration(totalSec)} · ${formatDistance(totalM)}`
          : `<strong>行程地图</strong>点左侧或图钉查看详情`;
      }

      // 路线画完后重新适配视野（未选中站点时）
      if (!selectedId) {
        setTimeout(() => {
          if (gen === routeGen) fitToVisible();
        }, 80);
      }
    }

    function refreshLegChips(legMap) {
      document.querySelectorAll(".leg-chip[data-leg]").forEach((el) => {
        const key = el.dataset.leg;
        const info = legMap[key];
        if (!info) {
          el.className = "leg-chip pending";
          el.innerHTML = "路线计算中…";
          return;
        }
        if (info.skip) {
          el.className = "leg-chip";
          el.innerHTML = "同点 / 步行即可";
          return;
        }
        el.className = "leg-chip" + (info.fallback ? " fail" : "");
        el.style.setProperty("--accent", el.dataset.accent || "");
        el.innerHTML = info.fallback
          ? `直线估算 · <strong>${formatDuration(info.time)}</strong> · ${formatDistance(info.distance)}`
          : `驾车 · <strong>${formatDuration(info.time)}</strong> · ${formatDistance(info.distance)}`;
      });
    }

    function clearMarkers() {
      if (!map) return;
      Object.values(markersById).forEach((m) => map.remove(m));
      Object.keys(markersById).forEach((k) => delete markersById[k]);
      clearRouteOverlays();
      routeGen++; // 取消进行中的算路
    }

    function renderMarkers() {
      if (!map) return;
      clearMarkers();
      // 地图始终画全部站点：点日期标签时点亮当天、淡化其它天
      const stops = STOPS.filter((s) => isValidChinaLngLat(s.lng, s.lat));

      stops.forEach((stop) => {
        const st = pinState(stop);
        const marker = new AMap.Marker({
          position: [stop.lng, stop.lat],
          content: pinHtml(stop, st),
          offset: new AMap.Pixel(-17, -30),
          title: `${dayMap[stop.day].short} · ${stop.name}`,
          zIndex: st.selected ? 140 : st.lit ? 120 : st.dim ? 60 : 100,
        });
        marker.on("click", () => {
          ignoreMapClickUntil = Date.now() + 280;
          // 点到其它天的淡化图钉时，自动切到那天并点亮
          if (activeDay !== "all" && stop.day !== activeDay) {
            activeDay = stop.day;
            renderDayFilters();
            renderList();
            refreshMarkerAppearance();
            updatePeekCopy();
          }
          selectStop(stop.id, { fromMap: true });
        });
        map.add(marker);
        markersById[stop.id] = marker;
      });

      const daysToRoute = activeDay === "all"
        ? DAYS.filter((d) => d.id !== "all")
        : [dayMap[activeDay]];
      const stopsByDay = daysToRoute.map((day) => ({
        day,
        stops: STOPS.filter((s) => s.day === day.id),
      })).filter((g) => g.stops.length > 1);

      drawDrivingRoutes(stopsByDay);
    }

    let fitTimer = null;

    // 本行程大致范围（北京-威海-青岛-许昌），比「全中国」紧很多，避免蒙古/贝加尔湖被当成合法视野
    function isValidTripLngLat(lng, lat) {
      const x = Number(lng);
      const y = Number(lat);
      return Number.isFinite(x) && Number.isFinite(y) && x >= 110 && x <= 125 && y >= 32 && y <= 42;
    }

    function isValidChinaLngLat(lng, lat) {
      // 仍用于 POI 过滤；视野校验请用 isValidTripLngLat / isNearTripCenter
      const x = Number(lng);
      const y = Number(lat);
      return Number.isFinite(x) && Number.isFinite(y) && x >= 73 && x <= 135 && y >= 18 && y <= 54;
    }

    function stopsBounds(stops) {
      let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
      stops.forEach((s) => {
        minLng = Math.min(minLng, Number(s.lng));
        maxLng = Math.max(maxLng, Number(s.lng));
        minLat = Math.min(minLat, Number(s.lat));
        maxLat = Math.max(maxLat, Number(s.lat));
      });
      return {
        minLng, maxLng, minLat, maxLat,
        centerLng: (minLng + maxLng) / 2,
        centerLat: (minLat + maxLat) / 2,
        spanLng: Math.max(0.02, maxLng - minLng),
        spanLat: Math.max(0.02, maxLat - minLat),
      };
    }

    function isNearTripCenter(lng, lat, centerLng, centerLat, spanLng, spanLat) {
      const maxDist = Math.max(6, spanLng * 2.5, spanLat * 2.5);
      return Math.abs(Number(lng) - centerLng) <= maxDist && Math.abs(Number(lat) - centerLat) <= maxDist;
    }

    function zoomForSpan(spanLng, spanLat) {
      let span = Math.max(spanLng, spanLat * 1.3, 0.02);
      if (isMobile()) span *= 2.4; // 抽屉挡一大块，多露一圈
      else span *= 1.2;
      if (span > 14) return 5;
      if (span > 9) return 6;
      if (span > 5) return 7;
      if (span > 2.8) return 8;
      if (span > 1.4) return 9;
      if (span > 0.7) return 10;
      if (span > 0.35) return 11;
      if (span > 0.15) return 12;
      if (span > 0.06) return 13;
      return 14;
    }

    function forceTripView(centerLng, centerLat, zoom) {
      if (!map) return;
      const lng = isValidTripLngLat(centerLng, centerLat) ? Number(centerLng) : 119.2;
      const lat = isValidTripLngLat(centerLng, centerLat) ? Number(centerLat) : 36.8;
      const z = Math.max(4, Math.min(16, zoom == null ? 6 : zoom));
      try {
        map.setZoomAndCenter(z, [lng, lat], false);
      } catch (e) {
        console.warn(e);
        try { map.setZoomAndCenter(6, [119.2, 36.8], false); } catch (_) {}
      }
    }

    function centerOnLngLat(lng, lat, zoom) {
      if (!map) return;
      // 单点也必须在行程带内，否则拉回默认
      if (!isValidTripLngLat(lng, lat) && !isValidChinaLngLat(lng, lat)) {
        forceTripView(119.2, 36.8, 6);
        return;
      }
      forceTripView(lng, lat, zoom);
    }

    function fitToVisible(delayMs) {
      const wait = typeof delayMs === "number" ? delayMs : (isMobile() ? 220 : 40);
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => doFitToVisible(), wait);
    }

    function doFitToVisible() {
      if (!map) return;
      try { map.resize(); } catch (_) {}

      const stops = visibleStops().filter((s) => isValidChinaLngLat(s.lng, s.lat));
      if (!stops.length) {
        forceTripView(119.2, 36.8, 6);
        return;
      }

      const b = stopsBounds(stops);
      // 全程中心大约在山东一带；若算出的中心离谱，用固定中心
      let { centerLng, centerLat, spanLng, spanLat } = b;
      if (!isValidTripLngLat(centerLng, centerLat)) {
        centerLng = 119.2;
        centerLat = 36.8;
      }

      const zoom = stops.length === 1
        ? (isMobile() ? 12 : 13)
        : zoomForSpan(spanLng, spanLat);

      // 关键禁止 setFitView / setBounds / panBy：iPhone 上会飞到蒙古/欧洲
      forceTripView(centerLng, centerLat, zoom);

      // 再读一次中心，偏了就强制拉回
      setTimeout(() => {
        try {
          const c = map.getCenter();
          const lng = c.getLng ? c.getLng() : c.lng;
          const lat = c.getLat ? c.getLat() : c.lat;
          if (!isNearTripCenter(lng, lat, centerLng, centerLat, spanLng, spanLat)) {
            forceTripView(centerLng, centerLat, zoom);
          }
        } catch (_) {
          forceTripView(centerLng, centerLat, zoom);
        }
      }, 100);
    }

    function selectStop(id, opts = {}) {
      const stop = STOPS.find((s) => s.id === id);
      if (!stop) return;
      selectedId = id;

      document.querySelectorAll(".stop").forEach((el) => {
        el.classList.toggle("selected", el.dataset.id === id);
      });

      refreshMarkerAppearance();

      // 手机：选中即收起列表，把拇指区留给「导航 / 上下站」
      if (isMobile()) {
        if (stop.id === "d1-depart") {
          hideSheet();
        } else {
          openSheet(stop);
          setDrawerSnap("peek");
        }
      } else {
        openSheet(stop);
      }

      if (map && isValidChinaLngLat(stop.lng, stop.lat) && (opts.fromList || opts.fromMap)) {
        const zoom = Math.max(map.getZoom(), isMobile() ? 14 : 13);
        setTimeout(() => centerOnLngLat(stop.lng, stop.lat, zoom), isMobile() ? 320 : 0);
      }

      const listItem = document.querySelector(`.stop[data-id="${id}"]`);
      if (listItem && (opts.fromMap || opts.fromList) && !isMobile()) {
        listItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      updateStepButtons();
      updatePeekCopy();
    }

    function updateStepButtons() {
      const pool = orderedStopsForNav();
      const idx = pool.findIndex((s) => s.id === selectedId);
      const prev = document.getElementById("prevStopBtn");
      const next = document.getElementById("nextStopBtn");
      if (prev) prev.disabled = idx <= 0;
      if (next) next.disabled = idx < 0 || idx >= pool.length - 1;
    }

    function openSheet(stop) {
      const day = dayMap[stop.day];
      const sheet = document.getElementById("sheet");
      document.getElementById("sheetDay").textContent = `${day.date} · ${day.title} · ${stop.time}`;
      document.getElementById("sheetDay").style.color = day.color;
      document.getElementById("sheetTitle").textContent = stop.name;
      const lodgingHint = stop.lodging
        ? `<p style="margin-top:8px"><strong style="color:var(--coral)">已订住宿</strong> · ${stop.desc}</p>`
        : `<p>${stop.desc}</p>`;
      document.getElementById("sheetBody").innerHTML = `
        ${lodgingHint}
        ${stop.tip ? `<p style="margin-top:8px"><strong style="color:var(--ink)">小贴士</strong> · ${stop.tip}</p>` : ""}
        ${stop.resolvedName ? `<p style="margin-top:8px;font-size:12px;color:var(--ink-soft)">高德定位：${stop.resolvedName}</p>` : `<p style="margin-top:8px;font-size:12px;color:var(--coral)">该点暂未校准到高德 POI，导航将按关键词搜索</p>`}
      `;
      const nav = document.getElementById("navBtn");
      nav.href = navHrefFor(stop);
      nav.textContent = stop.lodging ? "导航回酒店" : "高德导航";
      sheet.classList.add("open");
      const railEl = document.getElementById("rail");
      if (railEl) railEl.classList.add("sheet-open");
      const hint = document.getElementById("hudHint");
      if (hint) hint.style.display = "none";
      updateStepButtons();
      updatePeekCopy();
    }

    function hideSheet() {
      document.getElementById("sheet").classList.remove("open");
      const railEl = document.getElementById("rail");
      if (railEl) railEl.classList.remove("sheet-open");
      const hint = document.getElementById("hudHint");
      if (hint) hint.style.display = "";
    }

    function closeSheet() {
      hideSheet();
      selectedId = null;
      document.querySelectorAll(".stop").forEach((el) => el.classList.remove("selected"));
      refreshMarkerAppearance();
      updatePeekCopy();
      updateStepButtons();
    }

    document.getElementById("sheetClose").addEventListener("click", closeSheet);
    document.getElementById("fitBtn").addEventListener("click", fitToVisible);
    document.getElementById("focusBtn").addEventListener("click", () => {
      const stop = STOPS.find((s) => s.id === selectedId);
      if (stop && map && isValidChinaLngLat(stop.lng, stop.lat)) {
        if (isMobile()) setDrawerSnap("peek");
        setTimeout(() => centerOnLngLat(stop.lng, stop.lat, 15), isMobile() ? 320 : 0);
      }
    });
    document.getElementById("prevStopBtn").addEventListener("click", () => stepStop(-1));
    document.getElementById("nextStopBtn").addEventListener("click", () => stepStop(1));
    document.getElementById("homeFromSheetBtn").addEventListener("click", goHomeHotel);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSheet();
      if (e.key === "ArrowLeft") stepStop(-1);
      if (e.key === "ArrowRight") stepStop(1);
    });

    setupMobileDrawer();
    renderDayFilters();
    renderList();
    updatePeekCopy();
    updateMobileChrome();

    (function boot() {
      if (typeof AMap === "undefined") {
        setMapStatus(
          `<strong>高德地图加载失败</strong>请确认：① 控制台已绑定「Web端 JS API」；② 域名白名单含当前地址（局域网可填 <code>192.168.2.167</code>，本地调试可临时填 <code>*</code>）；③ 用系统浏览器打开，不要用微信内置预览。`,
          true
        );
        return;
      }
      try {
        initMap();
      } catch (e) {
        setMapStatus(
          `<strong>地图初始化失败</strong>${String(e && e.message ? e.message : e)}`,
          true
        );
      }
    })();
  </script>
</body>
</html>
